</head>
<body class="body-inscription">

     <section id="header">
            <a href="#"><img src="images/logo.jpeg" class="logo" alt="logo"></a>
            <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="index2.html">Boutique</a></li>
                <li><a href="page4.html">page3</a></li>
                <li><a href="page4.html">propos</a></li>

                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>

            </ul>
            </div>
        </section>

    <section class="container-flex">
        <form action="#" method="post" class="form-card">
            <h2>OutfitHub</h2>
            <p style="font-size:14px;margin-bottom:10px">Contactez-nous ou crée un compte</p>

            <label>Nom complet</label>
            <input type="text" name="nom" placeholder="Votre nom complet" required>

            <label>E-mail</label>
            <input type="text" name="nom" placeholder="Votre@mail.com" required>

            <label>Mot de passe</label>
            <input type="password" name="pass" placeholder="Crée un mot passe" minlength="8" required>
            <p class="instructions">Doit contenir au moins 8 caractéres.</p>

            <div class="genre-group">
                <label>Genre:</label>
                <input type="radio" name="genre" value="F" id="f" required> <label for="f">Femme</label>
                <input type="radio" name="genre" value="H" id="h"> <label for="h">Homme</label>
            </div>

            <input type="submit" value="Envoyer" class="btn-red">

            <p class="terms-text">
                En continuant,vous acceptez les<b>Conditions d'utilisation</b> de notre boutique.
            </p>

            <hr>

            <p class="login-link">
                Vous avez déja un compte ?<a href="#">Connectez-vous</a>
            </p>

        </form>
    </section>

</body>
</html>
