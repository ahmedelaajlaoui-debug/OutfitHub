<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>Contact-OutfitHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body class="body-inscription">

    <header>
        <!--les barre de navigation-->
        <section id="header">
            <!--logo dela la page-->
            <a href="#">
                <img src="images/logo.jpeg" class="logo" alt="logo">
            </a>
            <!-- les page du site  -->
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="index2.html">Boutique</a></li>
                <li><a href="produit.html">Produit</a></li>
                <li><a href="club.html">Club</a></li>
                <li><a href="inscription.html">Contact</a></li>
                <!-- pour afficher icône -->
                <li><a href="index2.html"><i class="fa-solid fa-bag-shopping"></i></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>

            </ul>
            <div id="mobil" class="mobil">
                <i id="bar" class="fas fa-outdent"></i>
            </div>
        </section>

    </header>

    <section class="container-flex">
        <form action="#" method="post" class="form-card">
            <h2>OutfitHub</h2>
            <p style="font-size:14px;margin-bottom:10px">Contactez-nous ou crée un compte</p>

            <label>Nom complet</label>
            <input type="text" name="nom" placeholder="Votre nom complet" required>

            <label>E-mail</label>
            <input type="text" name="nom" placeholder="Votre@mail.com" required>

            <label>Mot de passe</label>
            <input type="password" name="pass" placeholder="Crée un mot passe" minlength="8" required>
            <p class="instructions">Doit contenir au moins 8 caractéres.</p>

            <div class="genre-group">
                <label>Genre:</label>
                <input type="radio" name="genre" value="F" id="f" required> <label for="f">Femme</label>
                <input type="radio" name="genre" value="H" id="h"> <label for="h">Homme</label>
            </div>

            <input type="submit" value="Envoyer" class="btn-red">

            <p class="terms-text">
                En continuant,vous acceptez les<b>Conditions d'utilisation</b> de notre boutique.
            </p>

            <hr>

            <p class="login-link">
                Vous avez déja un compte ?<a href="#">Connectez-vous</a>
            </p>

        </form>
    </section>
    <script>
const bar = document.getElementById('bar');
const close = document.getElementById('close');
const nav = document.getElementById('navbar');

if (bar) {
    bar.addEventListener('click', () => {
        nav.classList.add('active');
    });
}

if (close) {
    close.addEventListener('click', () => {
        nav.classList.remove('active');
    });
}



</script>

</body>

</html>
